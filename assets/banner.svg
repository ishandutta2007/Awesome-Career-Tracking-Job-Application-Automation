<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <!-- Filter for subtle drop shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(320px); opacity: 0; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -40; }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 150px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 980px 250px; }
    .particle { animation: floatParticle 5s ease-in-out infinite; }
    .scan-line { animation: scanLine 6s linear infinite; }
    .pipeline-wire { stroke-dasharray: 6 6; animation: flowDash 2.5s linear infinite; }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#techGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb1" cx="220" cy="140" r="180" fill="url(#glowGrad1)" filter="blur(40px)" />
  <circle class="orb2" cx="960" cy="240" r="210" fill="url(#glowGrad2)" filter="blur(45px)" />

  <!-- Decorative Pipeline Wave / Network Lines (Behind Foreground Content) -->
  <g opacity="0.35">
    <path d="M 0,220 C 300,160 450,280 750,210 C 950,160 1100,240 1200,200" fill="none" stroke="#38bdf8" stroke-width="2" class="pipeline-wire" />
    <path d="M 0,260 C 250,310 500,200 800,270 C 1000,320 1120,250 1200,280" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 8" />
  </g>

  <!-- Foreground Main Title & Branding -->
  <g id="brand-header">
    <!-- Top Meta Tag / Pill -->
    <g transform="translate(140, 68)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="0.8">CAREER AUTOMATION ECOSYSTEM</text>
    </g>

    <!-- Main Repository Title -->
    <text x="140" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Awesome Career Tracking
    </text>

    <!-- Gradient Highlight Accent Subtitle -->
    <text x="140" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="url(#primaryGrad)">
      &amp; Job Application Automation
    </text>

    <!-- Descriptive Tagline -->
    <text x="140" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated directory of SaaS trackers, local AI resume matchers, ATS scoring tools &amp; autonomous job appliers.
    </text>
  </g>

  <!-- Interactive / Modern Feature Architecture Cards (Foreground Pill Row) -->
  <g transform="translate(140, 280)">
    <!-- Feature Pill 1: Kanban Pipeline -->
    <g transform="translate(0, 0)">
      <rect width="180" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect x="14" y="16" width="20" height="20" rx="4" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="24" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">📋</text>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Kanban Tracking</text>
      <text x="44" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">Huntr • Teal • Careerflow</text>
    </g>

    <!-- Feature Pill 2: AI Resume & ATS -->
    <g transform="translate(200, 0)">
      <rect width="195" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect x="14" y="16" width="20" height="20" rx="4" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
      <text x="24" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#818cf8" text-anchor="middle">🎯</text>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">ATS Optimization</text>
      <text x="44" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">Jobscan • Resume Matcher</text>
    </g>

    <!-- Feature Pill 3: Autonomous Agents -->
    <g transform="translate(415, 0)">
      <rect width="215" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect x="14" y="16" width="20" height="20" rx="4" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="1" />
      <text x="24" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">⚡</text>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Autonomous Agents</text>
      <text x="44" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">AIHawk • Sonara • LazyApply</text>
    </g>

    <!-- Feature Pill 4: Code & Typst/LaTeX -->
    <g transform="translate(650, 0)">
      <rect width="190" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect x="14" y="16" width="20" height="20" rx="4" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
      <text x="24" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">⚙️</text>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Resumes as Code</text>
      <text x="44" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">RenderCV • Reactive Resume</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
