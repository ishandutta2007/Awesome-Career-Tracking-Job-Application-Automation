<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -48; }
    }
    @keyframes cardFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes cardFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes cardFloat3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes cardFloat4 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes barPulse {
      0%, 100% { opacity: 0.5; height: 16px; y: 44px; }
      50% { opacity: 0.95; height: 32px; y: 28px; }
    }
    @keyframes barPulse2 {
      0%, 100% { opacity: 0.7; height: 36px; y: 24px; }
      50% { opacity: 0.4; height: 18px; y: 42px; }
    }
    @keyframes particleDrift {
      0%, 100% { transform: translate(0, 0); opacity: 0.4; }
      50% { transform: translate(15px, -20px); opacity: 0.85; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .orb1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 220px 140px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 980px 240px; }
    .pipeline-wire-1 { stroke-dasharray: 8 8; animation: flowDash 3s linear infinite; }
    .pipeline-wire-2 { stroke-dasharray: 6 6; animation: flowDash 2s linear infinite reverse; }

    .card-1 { animation: cardFloat1 4.5s ease-in-out infinite; }
    .card-2 { animation: cardFloat2 5.2s ease-in-out infinite 0.6s; }
    .card-3 { animation: cardFloat3 4.8s ease-in-out infinite 1.2s; }
    .card-4 { animation: cardFloat4 5.5s ease-in-out infinite 1.8s; }

    .chart-bar-1 { animation: barPulse 3.2s ease-in-out infinite; }
    .chart-bar-2 { animation: barPulse2 3.8s ease-in-out infinite; }
    .chart-bar-3 { animation: barPulse 4.2s ease-in-out infinite 0.8s; }
    .chart-bar-4 { animation: barPulse2 3.5s ease-in-out infinite 1.1s; }

    .particle-1 { animation: particleDrift 6s ease-in-out infinite; }
    .particle-2 { animation: particleDrift 8s ease-in-out infinite 2s; }
    .particle-3 { animation: particleDrift 7s ease-in-out infinite 3.5s; }
    
    .radar-beam { transform-origin: 1040px 115px; animation: radarSweep 6s linear infinite; }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#techGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb1" cx="220" cy="140" r="190" fill="url(#glowGrad1)" filter="blur(45px)" />
  <circle class="orb2" cx="960" cy="240" r="220" fill="url(#glowGrad2)" filter="blur(50px)" />

  <!-- Animated Floating Data Particles (Behind Foreground) -->
  <g opacity="0.6">
    <circle class="particle-1" cx="180" cy="80" r="2.5" fill="#38bdf8" />
    <circle class="particle-2" cx="890" cy="110" r="3" fill="#818cf8" />
    <circle class="particle-3" cx="1110" cy="290" r="2" fill="#c084fc" />
    <circle class="particle-1" cx="540" cy="70" r="2" fill="#34d399" />
    <circle class="particle-2" cx="720" cy="380" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Flowing Network / Pipeline Wires (Strictly in Background) -->
  <g opacity="0.32">
    <path d="M 0,210 C 280,150 440,270 740,200 C 950,150 1080,230 1200,190" fill="none" stroke="#38bdf8" stroke-width="2" class="pipeline-wire-1" />
    <path d="M 0,250 C 240,300 490,190 790,260 C 990,310 1110,240 1200,270" fill="none" stroke="#818cf8" stroke-width="1.5" class="pipeline-wire-2" />
  </g>

  <!-- Right Decorative Live Metric Widget (Dynamic Analytics & Flow Simulation) -->
  <g id="bg-visual-widget" transform="translate(930, 60)" opacity="0.85">
    <rect width="210" height="120" rx="12" fill="#0b1120" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Mini Metric Header -->
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">LIVE AUTOMATION PIPELINE</text>
    
    <!-- Dynamic Animated Activity Bar Graph -->
    <rect class="chart-bar-1" x="20" y="44" width="8" height="24" rx="2" fill="#38bdf8" />
    <rect class="chart-bar-2" x="34" y="24" width="8" height="44" rx="2" fill="#818cf8" />
    <rect class="chart-bar-3" x="48" y="36" width="8" height="32" rx="2" fill="#38bdf8" />
    <rect class="chart-bar-4" x="62" y="28" width="8" height="40" rx="2" fill="#c084fc" />
    <rect class="chart-bar-1" x="76" y="48" width="8" height="20" rx="2" fill="#34d399" />
    <rect class="chart-bar-2" x="90" y="32" width="8" height="36" rx="2" fill="#818cf8" />
    <rect class="chart-bar-3" x="104" y="22" width="8" height="46" rx="2" fill="#38bdf8" />

    <!-- Mini Radar / Status Indicator -->
    <g transform="translate(155, 48)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="20" r="10" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2" />
      <circle cx="20" cy="20" r="3" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <!-- Sweeping Line -->
      <line x1="20" y1="20" x2="38" y2="20" stroke="#34d399" stroke-width="1.5" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="4s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Status Text -->
    <circle cx="22" cy="98" r="4" fill="#34d399" />
    <text x="32" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Agents Active &amp; Dispatching</text>
  </g>

  <!-- FOREGROUND: Main Title & Branding (Completely Unobscured) -->
  <g id="brand-foreground">
    <!-- Top Meta Tag / Pill -->
    <g transform="translate(100, 68)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="0.8">CAREER AUTOMATION ECOSYSTEM</text>
    </g>

    <!-- Main Repository Title -->
    <text x="100" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Awesome Career Tracking
    </text>

    <!-- Gradient Highlight Accent Subtitle -->
    <text x="100" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="url(#primaryGrad)">
      &amp; Job Application Automation
    </text>

    <!-- Descriptive Tagline -->
    <text x="100" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated directory of SaaS trackers, local AI resume matchers, ATS scoring tools &amp; autonomous job appliers.
    </text>
  </g>

  <!-- FOREGROUND DYNAMIC PILLS: Animated Hover/Float Cards with Safe Margins -->
  <g id="feature-cards" transform="translate(100, 278)">
    <!-- Feature Pill 1: Kanban Pipeline -->
    <g class="card-1" transform="translate(0, 0)">
      <rect width="230" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect x="14" y="16" width="22" height="22" rx="5" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="25" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">📋</text>
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Kanban Tracking</text>
      <text x="46" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">Huntr • Teal • Careerflow</text>
    </g>

    <!-- Feature Pill 2: AI Resume & ATS -->
    <g class="card-2" transform="translate(252, 0)">
      <rect width="235" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect x="14" y="16" width="22" height="22" rx="5" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
      <text x="25" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#818cf8" text-anchor="middle">🎯</text>
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">ATS Optimization</text>
      <text x="46" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">Jobscan • Resume Matcher</text>
    </g>

    <!-- Feature Pill 3: Autonomous Agents -->
    <g class="card-3" transform="translate(509, 0)">
      <rect width="240" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect x="14" y="16" width="22" height="22" rx="5" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="1" />
      <text x="25" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">⚡</text>
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Autonomous Agents</text>
      <text x="46" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">AIHawk • Sonara • LazyApply</text>
    </g>

    <!-- Feature Pill 4: Code & Typst/LaTeX -->
    <g class="card-4" transform="translate(771, 0)">
      <rect width="230" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <rect x="14" y="16" width="22" height="22" rx="5" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
      <text x="25" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">⚙️</text>
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Resumes as Code</text>
      <text x="46" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">RenderCV • Reactive Resume</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar with Pulse Animation -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>